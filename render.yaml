services:
  - type: web
    name: kleelab-api
    runtime: python
    rootDir: kleelab-backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    # One worker: rate limits are counted in process memory, so more workers would
    # each keep their own count and multiply every limit.
    startCommand: uvicorn --app-dir src kleelab.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kleelab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Without this the API runs as "development": localhost origins pass CORS,
      # HSTS is off and the SECRET_KEY placeholder guard is skipped.
      - key: ENVIRONMENT
        value: production
      # The API sits behind Cloudflare, which overwrites CF-Connecting-IP with the
      # caller's address, so that header keys the rate limits. X-Forwarded-For,
      # read 2 entries from the end, is only the fallback when it is missing. On
      # the first request the API logs one "client address check" line with the
      # chain length, never an address.
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # Declared with `sync: false` so they are documented as required and survive
      # a blueprint sync. The values live in the dashboard and are never
      # committed: a key written here is a key written to git history.
      #
      # AI_ENABLED is the one to check first. With it false, or with no provider
      # key, the visitor enquiry chat answers from written replies only.
      - key: AI_ENABLED
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # The public site's address, used in links in emails (password resets,
      # invites, invoices). Without it they point at http://localhost:3000.
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Where new enquiries, client messages and add-on requests are emailed.
      # Falls back to SENDGRID_FROM_EMAIL, which is usually a no-reply address.
      - key: TEAM_INBOX
        sync: false
      # Paystack secret key (sk_test_... until the account is live). Unset means
      # online invoice payment is off. Webhook URL to set in Paystack:
      # https://<api host>/api/payments/paystack/webhook
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: kleelab-db
    databaseName: kleelab
    user: kleelab