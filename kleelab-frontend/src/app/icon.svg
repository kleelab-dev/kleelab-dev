<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon for KleeLab. Taken from g55-6.svg at the repo root — the chevron and
  its dot on their own, which is all that survives at tab size.

  The viewBox is NOT the source file's. g55-6.svg declares `0 0 26.05 29.32`
  while the artwork actually spans x 0 to 42.60 and y -0.73 to 30.07, so the
  source was clipping 39% off the right-hand side of the mark and a sliver off
  the top and bottom. These are the measured bounds with ~1 unit of breathing
  room, and they match MARK_VIEWBOX in KleeLabLogo.tsx.

  Fills are stated explicitly rather than inherited: a favicon loads as a
  standalone document with no cascade above it. The wordmark's inline SVG uses
  `currentColor` instead so it can sit on a light or dark surface; a favicon
  cannot do that, which is why this one is fixed to black.
-->
