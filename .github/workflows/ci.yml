name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kleelab-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Section kit
        # Every recipe must build a valid section and survive malformed input.
        # The AI builder composes sites from these, so a broken recipe would ship
        # as a blank gap or an invalid document on a customer's page.
        run: npm run check:sections

      - name: Sign-in redirect safety
        # `?next=` is attacker-controlled; a sign-in page that forwards anywhere
        # is a phishing tool wearing our domain.
        run: npm run check:auth

      - name: Build
        run: npm run build
        env:
          # Only used by the /api/* rewrite target; no backend is needed to build.
          API_URL: http://localhost:8000

  backend:
    name: Backend (import + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kleelab-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        # Importing the app exercises every router/schema without touching a database.
        run: python -c "from kleelab.main import app; print('routes:', len(app.openapi()['paths']))"
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: AI endpoint checks
        # What we do when the model answers wrongly: an invented section id, a page
        # with no home, a hostile slug, an answer of the wrong shape. Each must
        # degrade to a plainer site or a clear message, never a traceback.
        run: python scripts/check_ai.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Compile check
        run: python -m compileall -q src
