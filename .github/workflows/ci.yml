name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kleelab-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Sign-in redirect safety
        # `?next=` is attacker-controlled; a sign-in page that forwards anywhere
        # is a phishing tool wearing our domain.
        run: npm run check:auth

      - name: Client project page panels
        # The client's project page is six panels in a fixed order, with every
        # action still on it. Rendered with a fixed project: no API, no sign-in.
        run: npm run check:dashboard

      - name: Dashboard and verify-email redirects
        # One project opens straight away, two show the list, and old
        # verification links land on sign-in.
        run: npm run check:dashboard-redirect

      - name: Marketing visuals in the source
        # No hex colours in the new drawings, one shared step list on /contact and
        # /book, no new motion, and no "Built with" strip.
        run: npm run check:marketing-source

      - name: Build
        run: npm run build
        env:
          # Only used by the /api/* rewrite target; no backend is needed to build.
          API_URL: http://localhost:8000

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Public pages in a browser
        # The new visuals are present, nothing scrolls sideways at 375, 768 and 1280px,
        # drawings are hidden from screen readers, reduced motion stops everything, and
        # a service's share image is a 1200x630 PNG. Needs Node 22 for WebSocket and
        # the Chrome that ubuntu-latest ships with. The API is not running; the pages
        # cope with that.
        run: |
          npm run start -- -p 3000 > /tmp/site.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          npm run check:marketing
        env:
          API_URL: http://localhost:8000
          REQUIRE_BROWSER: "1"

  backend:
    name: Backend (import + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kleelab-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        # Importing the app exercises every router/schema without touching a database.
        run: python -c "from kleelab.main import app; print('routes:', len(app.openapi()['paths']))"
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Enquiry chat
        # The visitor chat on every public page. A model that answers well, badly,
        # or not at all must each end in a usable reply, never a traceback.
        run: python scripts/check_chat.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Provider routing and fallback
        # Which model answers which pass, and what happens when one key is missing,
        # one host is down, or both are. Runs with no key and no network, because a
        # check that needs a provider is a check nobody runs.
        run: python scripts/check_providers.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Allowed origins and public form limits
        # Production allows only the listed origins, never localhost or lookalikes;
        # the public forms get the strict per-minute budget; removed sign-up paths
        # stay removed. No key, no network, no database.
        run: python scripts/check_cors_and_limits.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Offline invoices and receipts
        # Money in minor units, status and overpayment rules, overdue by promised date,
        # invoice/receipt PDFs (online invoice PDF byte-identical), emailed PDF payload
        # with the provider faked, and every offline route staff-guarded.
        run: python scripts/check_offline_money.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Compile check
        run: python -m compileall -q src
