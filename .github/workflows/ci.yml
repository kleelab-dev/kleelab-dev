name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kleelab-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Sign-in redirect safety
        # `?next=` is attacker-controlled; a sign-in page that forwards anywhere
        # is a phishing tool wearing our domain.
        run: npm run check:auth

      - name: Build
        run: npm run build
        env:
          # Only used by the /api/* rewrite target; no backend is needed to build.
          API_URL: http://localhost:8000

  backend:
    name: Backend (import + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kleelab-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kleelab-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        # Importing the app exercises every router/schema without touching a database.
        run: python -c "from kleelab.main import app; print('routes:', len(app.openapi()['paths']))"
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Enquiry chat
        # The visitor chat on every public page. A model that answers well, badly,
        # or not at all must each end in a usable reply, never a traceback.
        run: python scripts/check_chat.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Design library data
        # The vendored dataset is committed verbatim, and the library the app loads
        # is compiled from it. This fails if the two have drifted apart, or if the
        # data changed shape upstream in a way nothing has been updated for.
        run: python scripts/compile_design_library.py --check

      - name: Design library behaviour
        # Which design a business is given: whether the trade is recognised, whether
        # the palette's text pairs are readable, whether the same business always
        # gets the same design, and whether two businesses in one trade get two.
        run: python scripts/check_design_library.py

      - name: Publishing addresses and origins
        # The address an owner is given for their site, and the CORS pattern that
        # decides whether a published site may call this API. Both fail silently in
        # a browser, so neither can be left to inspection.
        run: python scripts/check_publishing.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Provider routing and fallback
        # Which model answers which pass, and what happens when one key is missing,
        # one host is down, or both are. Runs with no key and no network, because a
        # check that needs a provider is a check nobody runs.
        run: python scripts/check_providers.py
        env:
          PYTHONPATH: src
          DATABASE_URL: postgresql://ci:ci@localhost:5432/kleelab
          SECRET_KEY: ci-placeholder-secret-key-not-for-production

      - name: Compile check
        run: python -m compileall -q src
